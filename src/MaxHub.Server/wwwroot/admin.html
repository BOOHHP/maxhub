<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · MaxHub</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<nav class="nav" id="topnav"></nav>

<div id="login-panel" class="login-wrap" hidden>
  <h2>登录 MaxHub 后台管理</h2>
  <p>使用飞书账号授权（需要审核者或管理员角色）</p>
  <button class="btn-primary" id="feishu-login" style="width:200px;height:38px">飞书扫码登录</button>
  <div class="hint">将跳转到飞书授权页，请勿关闭本页</div>
</div>

<main id="app" hidden>
  <h1 class="title">后台管理</h1>
  <p class="subtitle" id="role-hint"></p>

  <h2>待审核（<span id="pending-count">0</span>）</h2>
  <table id="pending-table">
    <thead><tr><th>工具</th><th>版本</th><th>提交人</th><th>提交时间</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>全部版本</h2>
  <table id="all-table">
    <thead><tr><th>工具</th><th>版本</th><th>状态</th><th>频道</th><th>签名</th><th>提交人</th><th>审核人</th><th>提交时间</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Connector 制品</h2>
  <table id="connector-table">
    <thead><tr><th>版本</th><th>支持 Max</th><th>大小</th><th>签名</th></tr></thead>
    <tbody></tbody>
  </table>
  <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="connector-upload" hidden>
    <input type="file" id="conn-file" accept=".zip" style="font-size:12px">
    <input id="conn-version" placeholder="版本号 1.4.0" style="width:110px">
    <input id="conn-min" placeholder="最低 2019" style="width:90px">
    <input id="conn-max" placeholder="最高 2026" style="width:90px">
    <button class="btn-primary" id="conn-submit">上传并注册</button>
  </div>
  <div class="hint">上传后立即签名并对 Agent 可见；需要管理员角色</div>

  <h2 id="member-title">成员角色</h2>
  <p class="subtitle" style="margin-bottom:8px">在飞书授权登录过的人会出现在这里。勾选即保存；不能取消自己的管理员角色。</p>
  <table id="member-table">
    <thead><tr><th>用户</th><th>管理员</th><th>审核者</th><th>发布者</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>使用统计 <span style="font-size:12px;color:var(--text-2)" id="active-users"></span></h2>
  <table id="stats-table">
    <thead><tr><th>工具@版本</th><th>下载</th><th>安装</th></tr></thead>
    <tbody></tbody>
  </table>
</main>

<div id="msg"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
const api = window.Api.api;
const toast = window.Api.toast;

function startLogin() {
  window.Api.startLogin();
}

function render() {
  const logged = window.Api.isLoggedIn();
  document.getElementById('login-panel').hidden = logged;
  document.getElementById('app').hidden = !logged;
  if (!logged) return;
  refresh();
  const user = window.MaxHubAuth?.user;
  if (user) {
    const isAdmin = window.Api.hasRole(user.roles, 'admin');
    document.getElementById('role-hint').textContent = `当前身份：${user.username}（${user.roles.join(' / ')}）`;
    document.getElementById('connector-upload').hidden = !isAdmin;
    const isReviewer = window.Api.hasRole(user.roles, 'reviewer');
    document.getElementById('member-title').style.display = isAdmin ? '' : 'none';
    document.getElementById('member-table').style.display = isAdmin ? '' : 'none';
    document.querySelector('#member-title + p').style.display = isAdmin ? '' : 'none';
    if (!isAdmin && !isReviewer) {
      document.getElementById('app').innerHTML = '<div class="login-wrap"><h2>无权限</h2><p>当前账号需要审核者或管理员角色才能访问后台。</p></div>';
    }
  }
}

async function loadReleases() {
  const res = await api('/api/v1/admin/releases');
  if (res.status === 401) { window.Api.logout(); return null; }
  if (res.status === 403) { toast('当前账号无审核者/管理员角色', false); return null; }
  return res.json();
}

async function review(releaseId, approve, channel) {
  const res = await api(`/api/v1/releases/${releaseId}/review`, {
    method: 'POST', body: JSON.stringify({ approve, channel }),
  });
  toast(res.ok ? (approve ? `已发布到 ${channel}` : '已退回') : '操作失败', res.ok);
  if (res.ok) refresh();
}

async function withdraw(releaseId) {
  if (!confirm('确认撤回该版本？撤回后索引与下载立即不可见。')) return;
  const res = await api(`/api/v1/releases/${releaseId}/withdraw`, { method: 'POST' });
  toast(res.ok ? '已撤回' : '撤回失败', res.ok);
  if (res.ok) refresh();
}

async function uploadConnector() {
  const file = document.getElementById('conn-file').files[0];
  const version = document.getElementById('conn-version').value.trim();
  const min = document.getElementById('conn-min').value.trim();
  const max = document.getElementById('conn-max').value.trim();
  if (!file || !version || !min || !max) { toast('请填写制品文件、版本与 Max 范围', false); return; }
  const form = new FormData();
  form.append('package', file);
  form.append('version', version);
  form.append('minMaxYear', min);
  form.append('maxMaxYear', max);
  const res = await fetch('/api/v1/admin/connectors', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + localStorage.maxhubToken },
    body: form,
  });
  toast(res.ok ? `Connector ${version} 已注册` : (res.status === 403 ? '需要管理员角色' : '上传失败'), res.ok);
  if (res.ok) refresh();
}

const fmt = (t) => new Date(t).toLocaleString('zh-CN', { hour12: false });

async function refresh() {
  const releases = await loadReleases();
  if (!releases) return;

  const pending = releases.filter(r => r.status === 'PendingReview');
  document.getElementById('pending-count').textContent = pending.length;
  document.querySelector('#pending-table tbody').innerHTML = pending.map(r => `
    <tr>
      <td>${r.name}<div style="color:var(--text-3);font-size:11px">${r.toolId}</div></td>
      <td>${r.version}</td>
      <td>${r.submittedBy}</td>
      <td>${fmt(r.submittedAtUtc)}</td>
      <td><div style="display:flex;gap:6px;align-items:center">
        <select id="ch-${r.releaseId}"><option>stable</option><option>beta</option><option>internal</option></select>
        <button class="btn-primary" onclick="review('${r.releaseId}', true, document.getElementById('ch-${r.releaseId}').value)">通过</button>
        <button class="btn-danger" onclick="review('${r.releaseId}', false, null)">退回</button>
      </div></td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">暂无待审核版本</td></tr>';

  document.querySelector('#all-table tbody').innerHTML = releases.map(r => `
    <tr>
      <td>${r.name}<div style="color:var(--text-3);font-size:11px">${r.toolId}</div></td>
      <td>${r.version}</td>
      <td><span class="badge ${r.status}">${{ PendingReview: '待审核', Published: '已发布', Rejected: '已退回', Withdrawn: '已撤回' }[r.status] ?? r.status}</span></td>
      <td>${r.channel}</td>
      <td>${r.signed ? '✓ 已签名' : '—'}</td>
      <td>${r.submittedBy}</td>
      <td>${r.reviewedBy ?? '—'}</td>
      <td>${fmt(r.submittedAtUtc)}</td>
      <td>${r.status === 'Published' ? `<button class="btn-danger" onclick="withdraw('${r.releaseId}')">撤回</button>` : ''}</td>
    </tr>`).join('');

  const connRes = await api('/api/v1/admin/connectors');
  if (connRes.ok) {
    const connectors = await connRes.json();
    document.querySelector('#connector-table tbody').innerHTML = connectors.map(c => `
      <tr><td>v${c.version}</td><td>${c.minMaxYear} - ${c.maxMaxYear}</td>
      <td>${(c.sizeBytes / 1024).toFixed(1)} KB</td><td>${c.signed ? '✓ 已签名' : '—'}</td></tr>`).join('')
      || '<tr><td colspan="4" class="empty">暂无制品</td></tr>';
  } else if (connRes.status === 403) {
    document.querySelector('#connector-table tbody').innerHTML =
      '<tr><td colspan="4" class="empty">需要管理员角色</td></tr>';
  }

  // 成员角色（仅 admin）
  const me = window.MaxHubAuth?.user;
  const isAdmin = me ? window.Api.hasRole(me.roles, 'admin') : false;
  if (isAdmin) {
    const membersRes = await api('/api/v1/admin/users');
    if (membersRes.ok) {
      const members = await membersRes.json();
      document.querySelector('#member-table tbody').innerHTML = members.map(u => {
        const self = me.employeeId === u.employeeId;
        const chk = (role, label) => `<label style="display:inline-flex;align-items:center;gap:5px;margin:0;font-size:12.5px;color:var(--text-1)">
          <input type="checkbox" data-emp="${u.employeeId}" data-role="${role}" ${u.roles.includes(role) ? 'checked' : ''} onchange="memberChanged('${u.employeeId}')">${label}</label>`;
        return `<tr><td>${u.username}<div style="color:var(--text-3);font-size:11px">${self ? '（我）' : ''}${u.employeeId}</div></td>
          <td>${chk('admin', '管理员')}</td><td>${chk('reviewer', '审核者')}</td><td>${chk('publisher', '发布者')}</td></tr>`;
      }).join('') || '<tr><td colspan="4" class="empty">暂无成员</td></tr>';
    }
  } else {
    document.querySelector('#member-table tbody').innerHTML = '';
  }

  const statsRes = await api('/api/v1/admin/stats');
  if (statsRes.ok) {
    const stats = await statsRes.json();
    document.getElementById('active-users').textContent = `活跃用户 ${stats.activeUsers}`;
    document.querySelector('#stats-table tbody').innerHTML = stats.subjects.map(s => `
      <tr><td>${s.subject}</td><td>${s.downloads}</td><td>${s.installs}</td></tr>`).join('')
      || '<tr><td colspan="3" class="empty">暂无数据</td></tr>';
  }
}

async function memberChanged(employeeId) {
  const me = window.MaxHubAuth?.user;
  const checked = [...document.querySelectorAll(`input[data-emp="${employeeId}"]:checked`)].map(i => i.dataset.role);
  if (me && me.employeeId === employeeId && !checked.includes('admin')) {
    toast('不能取消自己的管理员角色（防止锁死）', false);
    render();
    return;
  }
  const res = await api(`/api/v1/admin/users/${encodeURIComponent(employeeId)}/roles`, {
    method: 'PUT', body: JSON.stringify({ roles: checked }),
  });
  toast(res.ok ? '已保存角色' : (res.status === 403 ? '需要管理员角色' : '保存失败'), res.ok);
}

document.getElementById('feishu-login')?.addEventListener('click', startLogin);
document.getElementById('conn-submit')?.addEventListener('click', uploadConnector);
window.addEventListener('load', () => setTimeout(render, 300)); // 等 auth.js 完成导航与 me() 解析
</script>
</body>
</html>
