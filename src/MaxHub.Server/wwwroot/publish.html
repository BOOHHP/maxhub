<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布工具 · MaxHub</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/site.css?v=20260910.6">
<style>
  .publish-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .publish-layout > section { min-width: 0; }
  @media (max-width: 900px) { .publish-layout { grid-template-columns: 1fr; } }
  .dropzone { border: 1.5px dashed var(--border-strong); border-radius: var(--radius-l); padding: 30px; text-align: center; color: var(--text-2); cursor: pointer; transition: border-color var(--t-fast), background-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast); }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--text-1); background: var(--accent-soft); box-shadow: var(--focus-ring); }
  .dropzone .dz-ico { font-size: 26px; margin-bottom: 8px; }
  .dropzone .fname { color: var(--text-1); font-size: 13px; word-break: break-all; }
  .publish-layout section:nth-child(2) { animation-delay: .08s; }
  .publish-layout section:nth-child(3) { animation-delay: .16s; }
</style>
</head>
<body>
<nav class="nav" id="topnav"></nav>

<div id="login-panel" class="login-wrap" hidden>
  <h2>登录 MaxHub</h2>
  <p>登录后即可上传工具或发布新版本</p>
  <button class="btn-primary" id="feishu-login" style="width:200px;height:38px">飞书扫码登录</button>
  <div class="hint">将跳转到飞书授权页，请勿关闭本页</div>
</div>

<main id="app" hidden>
  <h1 class="title">发布工具</h1>
  <p class="subtitle" id="who"></p>

  <div class="publish-layout">
    <!-- 上传面板 -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">上传</span>
        <span class="panel-desc">脚本自动识别，或上传完整 zip 包</span>
      </div>
      <div class="panel-body">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn-outline" id="mode-script" style="padding:6px 16px">脚本直传（自动识别）</button>
          <button class="btn-outline" id="mode-zip" style="padding:6px 16px">上传 zip 包</button>
        </div>

        <div class="dropzone" id="dropzone">
          <div class="dz-ico">📥</div>
          <div id="dz-hint">拖拽文件到此处，或点击选择</div>
          <div id="dz-file" class="fname" hidden></div>
        </div>
        <input type="file" id="package" accept=".zip,.ms,.mcr,.py" hidden>
        <div class="hint" id="dz-desc" style="margin-top:8px">脚本直传：选择 .ms/.mcr/.py 脚本，自动识别名称与功能描述；zip 包：内含 manifest.json 与 payload。</div>

        <div id="script-fields" hidden>
          <div class="field"><label>工具名称</label>
            <input id="s-name" style="width:100%">
          </div>
          <div class="field"><label>功能描述（自动识别，可修改）</label>
            <textarea id="s-desc" rows="3" style="width:100%"></textarea>
          </div>
          <div class="grid-2">
            <div class="field"><label>版本号</label>
              <input id="s-version" value="1.0.0" style="width:100%">
            </div>
            <div class="field"><label>兼容 Max 范围</label>
              <div class="row">
                <input id="s-min" value="2019" style="width:70px">
                <span style="color:var(--text-3)">—</span>
                <input id="s-max" value="2026" style="width:70px">
              </div>
            </div>
          </div>
        </div>

        <div class="field" id="zip-notes-field"><label>更新说明（可选，展示给其他用户）</label>
          <textarea id="notes" rows="3" style="width:100%" placeholder="例如：新增按前缀批量重命名…"></textarea>
        </div>

        <button class="btn-primary" id="submit" style="margin-top:14px;padding:9px 24px">提交审核</button>
      </div>
    </section>

    <!-- 我的提交面板 -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">我的提交</span>
        <span class="panel-desc">全部版本与审核状态，待审核可撤回</span>
      </div>
      <div class="panel-body">
        <div class="table-scroll">
        <table id="mine-table">
          <thead><tr><th>工具</th><th>版本</th><th>状态</th><th>提交时间</th><th>审核人</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
        </div>
      </div>
    </section>

    <!-- 反馈跟踪面板 -->
    <section class="panel" style="grid-column:1 / -1">
      <div class="panel-head">
        <span class="panel-title">反馈跟踪</span>
        <span class="panel-desc">我发出的反馈与收到（作为工具上传者）的反馈及其处理进展</span>
        <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
          <label style="margin:0;font-size:12px;color:var(--text-2)">状态筛选</label>
          <select id="feedback-filter" onchange="loadFeedbacks()" style="width:130px">
            <option value="">全部</option>
            <option value="open">待处理</option>
            <option value="in_progress">处理中</option>
            <option value="resolved">已解决</option>
            <option value="wontfix">暂不处理</option>
          </select>
        </span>
      </div>
      <div class="panel-body">
        <p class="panel-sub">我发出的</p>
        <div class="table-scroll">
        <table id="my-feedback-table">
          <thead><tr><th>编号</th><th>对象</th><th>内容</th><th>状态</th><th>备注</th></tr></thead>
          <tbody></tbody>
        </table>
        </div>
        <div id="my-feedback-table-pager" hidden style="display:flex;align-items:center;justify-content:center;margin-top:8px"></div>
        <p class="panel-sub" style="margin-top:18px">我收到的</p>
        <div class="table-scroll">
        <table id="recv-feedback-table">
          <thead><tr><th>编号</th><th>反馈人</th><th>内容</th><th>状态</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
        </div>
        <div id="recv-feedback-table-pager" hidden style="display:flex;align-items:center;justify-content:center;margin-top:8px"></div>
      </div>
    </section>
  </div>
</main>

<!-- 状态变更弹窗（自绘，替代原生 prompt） -->
<div id="status-modal" hidden style="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)">
  <div style="background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius-l);padding:20px 22px;width:400px;box-shadow:var(--shadow-lift)">
    <h3 style="margin:0 0 4px;font-size:15px" id="status-modal-title">变更处理状态</h3>
    <p style="color:var(--text-3);font-size:12px;margin-bottom:12px">备注（可选）将随状态回执反馈人</p>
    <textarea id="status-modal-note" rows="3" style="width:100%" placeholder="例如：下版本修复 / 已排期 / 属预期行为…"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn-outline" id="status-modal-cancel">取消</button>
      <button class="btn-primary" id="status-modal-ok">确认变更</button>
    </div>
  </div>
</div>

<div id="msg"></div>

<script src="js/api.js?v=20260910.6"></script>
<script src="js/auth.js?v=20260910.6"></script>
<script>
const api = window.Api.api;
const toast = window.Api.toast;

function render() {
  const logged = window.Api.isLoggedIn();
  document.getElementById('login-panel').hidden = logged;
  document.getElementById('app').hidden = !logged;
  if (logged) {
    const user = window.MaxHubAuth?.user;
    document.getElementById('who').textContent = user ? `当前身份：${user.username}` : '';
    loadMine();
    loadFeedbacks();
    // 飞书卡片「去处理/查看进展」按钮带 #feedbacks 锚点：登录后滚动到反馈跟踪区
    if (location.hash === '#feedbacks')
      setTimeout(() => document.querySelector('#my-feedback-table')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 400);
  }
}

// ---- 文件选择与模式 ----
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('package');
let selectedFile = null;
let mode = 'script'; // script | zip

function setMode(m) {
  mode = m;
  document.getElementById('mode-script').className = m === 'script' ? 'btn-primary' : 'btn-outline';
  document.getElementById('mode-zip').className = m === 'zip' ? 'btn-primary' : 'btn-outline';
  fileInput.accept = m === 'script' ? '.ms,.mcr,.py' : '.zip';
  document.getElementById('script-fields').hidden = m !== 'script';
  document.getElementById('zip-notes-field').hidden = m === 'script';
  document.getElementById('dz-desc').textContent = m === 'script'
    ? '脚本直传：选择 .ms/.mcr/.py 脚本，自动识别名称与功能描述'
    : 'zip 包：内含 manifest.json（名称、版本、Max 兼容范围等）与 payload 文件';
  selectedFile = null;
  fileInput.value = '';
  document.getElementById('dz-hint').hidden = false;
  document.getElementById('dz-file').hidden = true;
}
document.getElementById('mode-script').addEventListener('click', () => setMode('script'));
document.getElementById('mode-zip').addEventListener('click', () => setMode('zip'));

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => selectFile(fileInput.files[0]));

async function selectFile(f) {
  selectedFile = f;
  document.getElementById('dz-hint').hidden = true;
  const fname = document.getElementById('dz-file');
  fname.hidden = false;
  fname.textContent = f.name + (f.size ? `（${(f.size / 1024).toFixed(1)} KB）` : '');
  // 脚本直传：自动识别并预填
  if (mode === 'script' && /\.(ms|mcr|py)$/i.test(f.name)) {
    const content = await f.text();
    try {
      const res = await api('/api/v1/scripts/analyze', {
        method: 'POST', body: JSON.stringify({ fileName: f.name, content }),
      });
      if (res.ok) {
        const d = await res.json();
        document.getElementById('s-name').value = d.name;
        document.getElementById('s-desc').value = d.description;
        window.Api.toast('已自动识别脚本信息，请确认后提交');
      }
    } catch { /* 分析失败则留空由用户填写 */ }
  }
}

// ---- 提交 ----
async function submit() {
  if (!selectedFile) { window.Api.toast('请先选择文件', false); return; }
  const btn = document.getElementById('submit');
  btn.disabled = true;
  try {
    let res;
    if (mode === 'script') {
      const content = await selectedFile.text();
      res = await api('/api/v1/scripts/publish', {
        method: 'POST',
        body: JSON.stringify({
          fileName: selectedFile.name,
          content,
          name: document.getElementById('s-name').value.trim(),
          description: document.getElementById('s-desc').value.trim(),
          version: document.getElementById('s-version').value.trim(),
          minMaxYear: +document.getElementById('s-min').value,
          maxMaxYear: +document.getElementById('s-max').value,
        }),
      });
    } else {
      const form = new FormData();
      form.append('package', selectedFile);
      const notes = document.getElementById('notes').value.trim();
      if (notes) form.append('notes', notes);
      res = await fetch('/api/v1/publish/releases', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + localStorage.maxhubToken },
        body: form,
      });
    }
    const body = await res.json().catch(() => ({}));
    if (res.ok) {
      window.Api.toast('已提交审核，等待审核者通过');
      selectedFile = null;
      fileInput.value = '';
      document.getElementById('dz-hint').hidden = false;
      document.getElementById('dz-file').hidden = true;
      document.getElementById('notes').value = '';
      loadMine();
    } else {
      const err = (body.errors || []).join('；') || '提交失败';
      window.Api.toast(err, false);
    }
  } finally {
    btn.disabled = false;
  }
}

// ---- 我的提交 ----
const statusText = { PendingReview: '待审核', Published: '已发布', Rejected: '已退回', Withdrawn: '已撤回' };
const fmt = (t) => new Date(t).toLocaleString('zh-CN', { hour12: false });

async function loadMine() {
  const res = await api('/api/v1/my-tools');
  if (!res.ok) return;
  const mine = await res.json();
  document.querySelector('#mine-table tbody').innerHTML = mine.map(r => `
    <tr>
      <td>${r.name}<div style="color:var(--text-3);font-size:11px">${r.publicToolId || r.toolId}</div></td>
      <td>${r.version}</td>
      <td><span class="badge ${r.status}">${statusText[r.status] ?? r.status}</span></td>
      <td>${fmt(r.submittedAtUtc)}</td>
      <td>${r.reviewedBy ?? '—'}</td>
      <td>${r.status === 'PendingReview'
        ? `<button class="btn-danger" style="padding:2px 10px;font-size:12px" onclick="cancelSubmission('${r.releaseId}')">撤回</button>`
        : ''}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="empty">还没有提交过工具</td></tr>';
}

async function cancelSubmission(releaseId) {
  if (!confirm('确认撤回该提交？撤回后需重新上传提交。')) return;
  const res = await api(`/api/v1/releases/${releaseId}/cancel`, { method: 'POST' });
  toast(res.ok ? '已撤回' : '撤回失败', res.ok);
  if (res.ok) loadMine();
}

// ---- 反馈跟踪 ----
const procBadge = { open: 'badge PendingReview', in_progress: 'badge beta', resolved: 'badge Published', wontfix: 'badge Withdrawn' };
const procName = { open: '待处理', in_progress: '处理中', resolved: '已解决', wontfix: '暂不处理' };
const FEEDBACK_PAGE_SIZE = 20;
let feedbackCache = { mine: [], recv: [] };
let feedbackPage = { mine: 0, recv: 0 };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function feedbackRowHtml(f, mine) {
  return `
    <tr id="fb-row-${f.id}">
      <td style="white-space:nowrap">#${f.id}</td>
      <td>${mine ? (f.scope === 'tool' ? esc(f.toolName || '未知工具') : '平台') : esc(f.fromUsername)}</td>
      <td style="max-width:340px;white-space:pre-wrap">${esc(f.message)}</td>
      <td><span class="${procBadge[f.status] ?? 'badge PendingReview'}">${esc(f.statusText)}</span>
        ${f.note ? `<div style="color:var(--text-3);font-size:11px;margin-top:2px">${esc(f.note)}</div>` : ''}</td>
      <td>${mine ? '' : ['open', 'in_progress', 'resolved', 'wontfix'].filter(s => s !== f.status)
        .map(s => `<button class="btn-outline" style="padding:1px 6px;font-size:11px;margin:0 2px 2px 0" onclick="setFeedbackStatus(${f.id}, '${s}')">${procName[s]}</button>`).join('')}</td>
    </tr>`;
}

function renderFeedbackTable(tableId, key, mine) {
  const filter = document.getElementById('feedback-filter')?.value ?? '';
  const filtered = filter ? feedbackCache[key].filter(f => f.status === filter) : feedbackCache[key];
  const start = feedbackPage[key] * FEEDBACK_PAGE_SIZE;
  const pageItems = filtered.slice(start, start + FEEDBACK_PAGE_SIZE);
  const total = filtered.length;
  const tbody = document.querySelector(`#${tableId} tbody`);
  tbody.innerHTML = pageItems.map(f => feedbackRowHtml(f, key === 'mine')).join('')
    || '<tr><td colspan="5" class="empty">暂无反馈</td></tr>';
  // 分页条：多于一页时显示
  const pagerId = `#${tableId}-pager`;
  let pager = document.querySelector(pagerId);
  if (total > FEEDBACK_PAGE_SIZE) {
    const page = feedbackPage[key];
    const pages = Math.ceil(total / FEEDBACK_PAGE_SIZE);
    pager.hidden = false;
    pager.innerHTML = `
      <button class="btn-outline" style="padding:2px 10px;font-size:11px" ${page === 0 ? 'disabled' : ''} onclick="feedbackPage['${key}']--; loadFeedbacksRender()">上一页</button>
      <span style="color:var(--text-3);font-size:12px;margin:0 8px">第 ${page + 1} / ${pages} 页 · 共 ${total} 条</span>
      <button class="btn-outline" style="padding:2px 10px;font-size:11px" ${page + 1 >= pages ? 'disabled' : ''} onclick="feedbackPage['${key}']++; loadFeedbacksRender()">下一页</button>`;
  } else {
    pager.hidden = true;
  }
}

function loadFeedbacksRender() {
  renderFeedbackTable('my-feedback-table', 'mine', true);
  renderFeedbackTable('recv-feedback-table', 'recv', false);
}

async function loadFeedbacks() {
  const filter = document.getElementById('feedback-filter')?.value ?? '';
  const apply = (items) => filter ? items.filter(f => f.status === filter) : items;
  const mineRes = await api('/api/v1/my-feedbacks');
  if (mineRes.ok) feedbackCache.mine = apply(await mineRes.json());
  const recvRes = await api('/api/v1/feedbacks/recipients');
  if (recvRes.ok) feedbackCache.recv = apply(await recvRes.json());
  feedbackPage = { mine: 0, recv: 0 };
  loadFeedbacksRender();
  // 卡片锚点（#fb-<id>）：滚动到对应行并高亮，提示最新变更
  highlightFromHash();
}

function highlightFromHash() {
  const m = location.hash.match(/^#fb-(\d+)$/);
  if (!m) return;
  const row = document.getElementById(`fb-row-${m[1]}`);
  if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.style.transition = 'background-color 0.4s';
  row.style.backgroundColor = 'rgba(76,159,224,.18)';
  setTimeout(() => { row.style.backgroundColor = ''; }, 3000);
}

let statusModalContext = null;
function openStatusModal(id, status) {
  document.getElementById('status-modal').hidden = false;
  document.getElementById('status-modal-title').textContent =
    `变更处理状态 → ${procName[status]}（#${id}）`;
  document.getElementById('status-modal-note').value = '';
  document.getElementById('status-modal-note').focus();
  document.getElementById('status-modal-ok').onclick = async () => {
    const note = document.getElementById('status-modal-note').value.trim();
    closeStatusModal();
    const res = await api(`/api/v1/feedbacks/${id}/status`, {
      method: 'PATCH', body: JSON.stringify({ status, note }),
    });
    toast(res.ok ? `已更新为「${procName[status]}」并回执反馈人` : (res.status === 403 ? '仅接收人/管理员可变更' : '更新失败'), res.ok);
    if (res.ok) loadFeedbacks();
  };
  document.getElementById('status-modal-cancel').onclick = closeStatusModal;
}
function closeStatusModal() {
  document.getElementById('status-modal').hidden = true;
  document.getElementById('status-modal-note').value = '';
}
async function setFeedbackStatus(id, status) {
  openStatusModal(id, status);
}

document.getElementById('feishu-login')?.addEventListener('click', () => window.Api.startLogin());
document.getElementById('submit')?.addEventListener('click', submit);
setMode('script'); // 默认脚本直传模式
window.addEventListener('maxhub-auth-ready', render); // auth.js 完成登录态解析后触发
</script>
</body>
</html>
